<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Daily Brief</title>
<meta name="description" content="The whole day in one page: the most important stories, cross-checked across newsrooms.">
<meta name="theme-color" content="#0B0B0D">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="app.css">
</head><body>
<div class="tick" id="tickBox"><div class="tick-run" id="tick"></div></div>
<div class="wrap">
  <header class="mast">
    <a class="brand" href="#" id="home"><span class="logo" aria-hidden="true"></span><h1>The Daily <i>Brief</i></h1></a>
    <div class="tools">
      <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Search today's news  ( / )" autocomplete="off"></label>
      <button class="ib" id="bell" title="Alerts for breaking news and your watch words">🔔</button>
      <button class="ib" id="watchBtn" title="Your watch words">★</button>
    </div>
  </header>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <div class="bar2">
    <div class="datebox"><button class="ib sm" id="prevDay" title="Previous day">‹</button><span class="pill" id="date"></span><button class="ib sm" id="nextDay" title="Next day">›</button></div>
    <span class="meta" id="meta"></span>
    <button class="newchip" id="newChip" hidden></button>
  </div>
  <div id="breaking"></div>
  <main id="main"></main>
  <footer class="foot" id="foot"></footer>
</div>
<aside class="drawer" id="drawer" aria-hidden="true"><div class="dr-shade" id="drShade"></div><div class="dr-panel" id="drPanel" role="dialog" aria-modal="true"></div></aside>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>
<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="app.js"></script>
</body></html>
